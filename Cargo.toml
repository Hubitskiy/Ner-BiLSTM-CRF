[package]
name = "BiLSTM-CRF"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "make_vocabulary"
path = "src/make_vocabulary.rs"

[[bin]]
name = "train_model"
path = "src/train_model.rs"

[[bin]]
name = "infer_model"
path = "src/infer_model.rs"

[lib]
name = "neuro"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
burn = { version = "0.22.0", features = ["autodiff", "train", "wgpu", "metal"] }
env_logger = "0.11.11"
indexmap = { version = "2.14.0", features = ["serde"] }
log = "0.4.34"
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
